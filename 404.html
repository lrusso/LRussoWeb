<!doctype html>
<html lang="en">
  <head>
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      var redirects = {
        "/cssminifier": "/CSSMinifier",
        "/githubread": "/GitHubRead",
        "/intranet": "/Intranet",
        "/javascriptminifier": "/JavaScriptMinifier",
        "/mediaplayer": "/MediaPlayer",
        "/mp3converter": "/MP3Converter",
        "/mp3tageditor": "/MP3TagEditor",
        "/pdfconverter": "/PDFConverter",
        "/puzzlebobble": "/PuzzleBobble",
        "/quake3": "/Quake3",
        "/resources": "/Resources",
        "/resumechecker": "/ResumeChecker",
        "/signaturegenerator": "/SignatureGenerator",
        "/spider": "/Spider",
        "/taipei": "/Taipei",
        "/tarot": "/Tarot",
        "/tetris": "/Tetris",
        "/tinyace": "/TinyACE",
        "/tinydoc": "/TinyDOC",
        "/tinyimg": "/TinyIMG",
        "/videocallwallpaper": "/VideoCallWallpaper",
        "/webcamrecorder": "/WebcamRecorder",
        "/webzip": "/WebZip",
      }

      // the query and the hash are left out of the comparison, so an address
      // like "/tetris?x=1" still matches, and they're kept for the redirect.
      var requestedURL = window.location.href
        .split("#")[0]
        .split("?")[0]
        .toLowerCase()
        .trim()
      var requestedExtras = window.location.search + window.location.hash
      var currentDomain =
        window.location.origin.toLowerCase().indexOf("file://") === 0
          ? "index.html"
          : window.location.origin.toLowerCase()
      var mustRedirectToHome = true

      // browsers without the native ends with method would stop the script there
      // and never redirect.
      function endsWith(text, suffix) {
        return text.slice(-suffix.length) === suffix
      }

      // replace() swaps this page for the destination in the history, so going
      // back skips it. browsers already do that for redirects made while the
      // page is loading, but this way it doesn't depend on that.
      for (var path in redirects) {
        if (
          endsWith(requestedURL, currentDomain + path) ||
          endsWith(requestedURL, currentDomain + path + "/")
        ) {
          mustRedirectToHome = false
          if (redirects[path].indexOf("/") === 0) {
            window.location.replace(
              currentDomain + redirects[path] + "/" + requestedExtras
            )
          } else {
            window.location.replace(redirects[path])
          }
        }
      }

      if (mustRedirectToHome) {
        window.location.replace(currentDomain)
      }
    </script>
  </body>
</html>
